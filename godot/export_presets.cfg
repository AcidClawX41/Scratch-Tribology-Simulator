; Presets de exportación de Tribology Simulator & Industrial Workshop 2.0 (Godot 4.7.2; antes Scratch Tribology
; Simulator). Los identificadores de paquete siguen siendo com.acidclawx41.scratchtribology: la 2.0 se instala encima de la 1.x.
; Solo se escriben las opciones que difieren de los valores por defecto o que conviene dejar a la vista;
; el resto las pone Godot al cargar el archivo. Si lo guardas desde el editor, reescribirá el archivo
; completo y sin estos comentarios: no pasa nada, la explicación de cada opción está en docs/GODOT-EXPORT.md.
; Sin secretos: los almacenes de claves de Android se pasan por variables de entorno (GODOT_ANDROID_KEYSTORE_*).
; La versión aparece en el formato que admite cada plataforma; al subirla, cámbiala en todos los presets y en
; godot/project.godot (godot-release.yml comprueba que coinciden).

[preset.0]

name="Windows"
platform="Windows Desktop"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/godot/windows/TribologySimulatorWorkshop.exe"

[preset.0.options]

; Un solo .exe de 64 bits con el pck dentro, que se reparte en un .zip sin instalador
binary_format/architecture="x86_64"
binary_format/embed_pck=true
; Icono y metadatos del .exe: Godot los escribe él mismo, también al exportar desde Linux
application/modify_resources=true
application/icon="res://assets/icon.png"
; Windows solo admite versiones de cuatro números: 2.0.0 con código 3 queda en 2.0.0.3 (el código va por encima del 2
; de la 1.0.1, para que Android y iOS instalen la 2.0 encima de la 1.x)
application/file_version="2.0.0.3"
application/product_version="2.0.0.3"
application/company_name="Eric Valls Gramunt"
application/product_name="Tribology Simulator & Industrial Workshop"
application/file_description="Tribology Simulator & Industrial Workshop"
application/copyright="© 2026 Eric Valls Gramunt"
application/trademarks=""
; Sin certificado de firma de código: Windows SmartScreen avisará al abrirlo por primera vez
codesign/enable=false

[preset.1]

name="macOS"
platform="macOS"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/godot/macos/TribologySimulatorWorkshop.zip"

[preset.1.options]

; Universal (Intel y Apple Silicon): las plantillas oficiales solo traen binarios universales
binary_format/architecture="universal"
export/distribution_type=1
application/icon="res://assets/icon.png"
application/bundle_identifier="com.acidclawx41.scratchtribology"
application/app_category="Education"
; Apple exige versiones numéricas: 2.0.0 visible y 3 como número de compilación (el código de la versión)
application/short_version="2.0.0"
application/version="3"
application/copyright="© 2026 Eric Valls Gramunt"
; Mínimos de Godot 4.7: macOS 11 en Intel (Vulkan con MoltenVK) y 13 en Apple Silicon (Metal)
application/min_macos_version_x86_64="11.00"
application/min_macos_version_arm64="13.00"
display/high_res=true
; Firma ad hoc con el firmador integrado de Godot (sirve desde Linux y desde macOS), sin notarizar
codesign/codesign=1
notarization/notarization=0

[preset.2]

name="Linux"
platform="Linux"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/godot/linux/TribologySimulatorWorkshop.x86_64"

[preset.2.options]

binary_format/architecture="x86_64"
; El pck va dentro del ejecutable: un solo archivo para el .tar.gz, la AppImage y el .deb
binary_format/embed_pck=true

[preset.3]

name="Android"
platform="Android"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/godot/android/TribologySimulatorWorkshop.apk"

[preset.3.options]

; APK con la plantilla precompilada de Godot 4.7 (sin Gradle): minSdk 24 (Android 7.0) y targetSdk 36.
; En Android 7.0–8.x (sin Vulkan 1.1) Godot usa el renderizador Compatibility (OpenGL ES 3.0), porque
; project.godot tiene rendering/rendering_device/fallback_to_opengl3=true; desde Android 9, el renderizador Mobile.
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.acidclawx41.scratchtribology"
package/name="Tribology Simulator & Industrial Workshop"
package/signed=true
; «Undefined»: no es un juego, así que Android no le aplica el modo juego
package/app_category=9
version/code=3
version/name="2.0.0"
; Permisos mínimos: sin Internet, porque el programa no usa la red; solo la vibración (VIBRATE, un permiso «normal»:
; Android lo concede al instalar, sin preguntar), para los hápticos del laboratorio (Input.vibrate_handheld)
permissions/internet=false
permissions/vibrate=true

[preset.4]

name="iOS"
platform="iOS"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/godot/ios/TribologySimulatorWorkshop.ipa"

[preset.4.options]

; Solo el proyecto Xcode: la .ipa sin firmar la compila xcodebuild en macOS (godot-release.yml)
application/export_project_only=true
; Godot exige un Team ID aunque no se firme: es un marcador. Pon el tuyo si algún día firmas en Xcode
application/app_store_team_id="0000000000"
application/bundle_identifier="com.acidclawx41.scratchtribology"
application/short_version="2.0.0"
application/version="3"
; iPhone y iPad
application/targeted_device_family=2
; iOS 15 con Vulkan (MoltenVK); desde iOS 16, Metal
application/min_ios_version="15.0"
architectures/arm64=true
; Fondo de la pantalla de arranque: el color de fondo de la app (#170E1C)
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.0901961, 0.054902, 0.109804, 1)
